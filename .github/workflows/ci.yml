name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same versions as uv.lock / pyproject, so CI output matches local runs.
  UV_VERSION: "0.11.25"
  PYDANTIC_AI_NO_BANNER: "1"

jobs:
  backend:
    name: backend (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: review_radar_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:55433/review_radar_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Lint (ruff, pinned in uv.lock)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Tests on Postgres 16 + pgvector, 90% coverage gate on domain and application
        run: >
          uv run pytest
          --cov=review_radar.domain --cov=review_radar.application
          --cov-report=term-missing --cov-fail-under=90
      - name: Triage eval in demo mode
        run: uv run review-radar eval --min-accuracy 0.85 --min-macro-f1 0.85

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: docker compose + Playwright smoke
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
