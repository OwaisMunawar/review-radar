name: review-radar

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: review_radar
      POSTGRES_PASSWORD: review_radar
      POSTGRES_DB: review_radar
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_radar -d review_radar"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://review_radar:review_radar@db:5432/review_radar
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      LOG_JSON: "true"
    # Migrate, seed the demo dataset on first boot only, then serve.
    command: >
      sh -c "review-radar migrate && review-radar seed --if-empty && review-radar serve --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
